name: release

# Gera os instaladores de Windows e Linux quando uma tag v* é publicada
# e anexa tudo numa release do GitHub. macOS fica de fora: sem conta de
# desenvolvedor Apple o app não abre lá, e o runner de Mac gasta 10x mais minutos.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # sem o secret da chave de atualização a release sai mesmo assim, só sem os arquivos de update
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Sem chave de atualização, release sem arquivos de update
        if: env.HAS_UPDATER_KEY != 'true'
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(f,JSON.stringify(c,null,2))"
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY ausente: esta release não gera latest.json (o launcher instalado não vai se atualizar sozinho para ela)"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # assina as atualizações (o launcher confere com a chave pública do tauri.conf.json)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GG77 Launcher ${{ github.ref_name }}"
          releaseBody: "Windows: baixe o arquivo terminado em -setup.exe. Linux: .AppImage (roda direto e se atualiza sozinho) ou .deb."
          releaseDraft: false
          # latest.json: o que o launcher instalado consulta para se atualizar
          includeUpdaterJson: true
          args: ${{ matrix.args }}
