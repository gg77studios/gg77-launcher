[package]
name = "gg77-launcher"
version = "0.2.0"
description = "Launcher de desktop para os jogos de navegador do grupo"
edition = "2021"

[lib]
name = "gg77_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# pacotes de jogo: download, integridade, assinatura e extração
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream", "http2", "system-proxy"] }
futures-util = "0.3"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
ed25519-dalek = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
